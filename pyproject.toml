# blenderui: Blender's UI as a Python library (import blenderui / bui).
# Built with scikit-build-core, which drives the CMake build of the C kit and
# the buipy extension. See docs/publishing.md for the release checklist.

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "blenderui"
dynamic = ["version"]
description = "Blender's UI as a library: run tkinter apps unchanged, write Qt-style code, or use Blender components — all drawn by a fast C kit"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "BUI contributors" }]
keywords = ["gui", "ui", "blender", "tkinter", "qt", "widgets", "toolkit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Software Development :: Widget Sets",
]
dependencies = []

[project.optional-dependencies]
qt = ["PySide6>=6.5"]            # only for bui.qt.BuiCanvas (embedding in a real Qt app)
test = []

[project.urls]
Homepage = "https://bui.preetham.top"
Documentation = "https://github.com/ppmpreetham/BUI/tree/main/docs"
Source = "https://github.com/ppmpreetham/BUI"
Issues = "https://github.com/ppmpreetham/BUI/issues"
Changelog = "https://github.com/ppmpreetham/BUI/blob/main/CHANGELOG.md"

[project.scripts]
blenderui-tk = "bui.tksyntax.__main__:main"   # blenderui-tk app.py == python -m bui.tksyntax app.py

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
# one extension: buipy, with Dear ImGui (blenderui.imgui) compiled in so a process holds one kit
build.targets = ["buipy"]
wheel.packages = []          # CMake installs bui/, blenderui/ and buipy
wheel.exclude = ["**/__pycache__/**"]
sdist.exclude = ["reference/", "build*/", ".github/", "**/__pycache__/", "*.pyd", "*.so"]

[tool.scikit-build.cmake.define]
BUI_BUILD_TESTS = "OFF"
BUI_BUILD_EXAMPLES = "OFF"
BUI_BUILD_UI = "OFF"
BUI_BUILD_QT_BACKEND = "OFF"
BUI_BUILD_PYTHON_BINDINGS = "ON"
BUI_BUILD_IMGUI = "ON"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "bindings/python/bui/_version.py"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
test-command = "python -c \"import blenderui, buipy, blenderui.tksyntax, blenderui.components, blenderui.imgui; print(blenderui.__version__)\""

[tool.cibuildwheel.macos]
# macOS 11+ on Intel too (Apple Silicon's minimum; cibuildwheel's Intel default is
# 10.13): newer libc++ C++20 than 10.13 has stays usable, and the Cocoa host
# (kit_window_cocoa.m) needs 10.12+.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.linux]
# The X11 headers, so Linux wheels get the native window host. libX11 itself
# is loaded at run time (dlopen), so the wheels still import without it.
before-all = "dnf install -y libX11-devel || yum install -y libX11-devel || (apt-get update && apt-get install -y libx11-dev)"
