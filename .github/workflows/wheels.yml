# Build blenderui wheels + sdist, test them, and publish to PyPI on a tag.
#
#   pull requests / pushes: build and test only
#   tag v*  (e.g. v0.1.0):  build, test, publish to PyPI (trusted publishing)
#   manual run:             build, test, optionally publish to TestPyPI
#
# See docs/publishing.md for the one-time PyPI setup.

name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI"
        type: boolean
        default: false

jobs:
  # Only build and publish what is missing: a tag whose version is already on PyPI (say a release
  # that only changed the npm packages, or a re-run after PyPI succeeded) does no work at all.
  plan:
    name: is this version on PyPI?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - id: plan
        run: |
          build=true
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/blenderui/$version/json")
            if [ "$code" = 200 ]; then
              echo "::notice::blenderui $version is already on PyPI; nothing to build or publish"
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  wheels:
    name: wheels (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS: Apple Silicon (macos-15) and Intel (macos-15-intel; the macos-13
        # images are retired, jobs on them stay queued)
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      # Windows wheels are built with MinGW-w64 (UCRT) GCC: the toolchain the
      # project is developed and tested with. The .pyd links the runtime
      # statically and needs only system DLLs.
      - name: MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
          path-type: inherit
      - name: Put MinGW on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test wheels
        run: |
          python -m pip install "cibuildwheel>=3,<4"
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT_WINDOWS: CMAKE_GENERATOR="MinGW Makefiles" CC=gcc CXX=g++
          CIBW_ARCHS_MACOS: native
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Full test suites on the source build (Windows: the native window host).
  tests:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make
          path-type: inherit
      - shell: bash
        run: |
          export PATH="${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin:$PATH"
          cmake -S . -B build -G "MinGW Makefiles" -DPython3_EXECUTABLE="$(which python)"
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure

  publish:
    needs: [plan, wheels, sdist, tests]
    if: needs.plan.outputs.build == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.testpypi))
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write  # PyPI trusted publishing (no API token stored)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to TestPyPI
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
