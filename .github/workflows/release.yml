# Publish a release: crates.io, npm and a GitHub Release. (PyPI is published by
# wheels.yml, which also runs on the same tag.)
#
#   git tag v0.2.0 && git push --tags
#
# Every step is safe to re-run: a version that is already on a registry is skipped, so a
# failed run (a network timeout, say) can be repeated with "Re-run failed jobs".
#
#   tag v*           : check versions, run the whole CI suite, then publish
#   manual run       : same, but nothing is published unless "publish" is ticked
#                      (the default is a dry run: cargo publish --dry-run, npm publish --dry-run)
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   CARGO_REGISTRY_TOKEN   a crates.io API token (scopes: publish-new, publish-update)
# npm and PyPI need no secret: both use trusted publishing (OIDC). On npmjs.com, each of
# @blender-ui/native, its platform packages (@blender-ui/native-<tag>, bindings/node/platform.js)
# and @blender-ui/react lists this repository and the workflow file release.yml as its trusted
# publisher. See docs/publishing.md.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check against (e.g. v0.2.0)"
        required: true
      publish:
        description: "Really publish (otherwise a dry run)"
        type: boolean
        default: false
      skip_ci:
        description: "Skip the CI suite (only if you know it is red for a reason that does not affect the release)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}

jobs:
  versions:
    name: versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_versions.py "$TAG"
      - name: Third-party notices are up to date
        run: python tools/gen_notices.py --check

  ci:
    name: build and test everywhere
    needs: versions
    if: github.event.inputs.skip_ci != 'true'
    uses: ./.github/workflows/ci.yml

  crates:
    name: crates.io
    needs: [versions, ci]
    # runs when the versions match and CI passed (or was skipped on purpose)
    if: ${{ !cancelled() && needs.versions.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Vendor the C sources (blenderui-sys carries them)
        run: python bindings/rust/scripts/vendor_c.py
      - name: Publish in dependency order
        working-directory: bindings/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${TAG#v}"
          for crate in blenderui-tailwind blenderui-macros blenderui-sys blenderui-paint blenderui-table blenderui-vlist blenderui blenderui-imgui; do
            # crates.io's API wants an identifying User-Agent (curl's default can be refused, which made
            # this check fail and a re-run try to publish a crate that was already there)
            if [ "$(curl -s -A 'bui-release-ci (https://github.com/ppmpreetham/BUI)' -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$crate/$version")" = 200 ]; then
              echo "::notice::$crate $version is already on crates.io; skipping"
              continue
            fi
            flags="--allow-dirty -j 2"
            [ "$PUBLISH" = true ] || flags="$flags --dry-run"
            # uploads of the big blenderui-sys crate sometimes time out (HTTP 408): retry
            for attempt in 1 2 3; do
              log=$(mktemp)
              rc=0
              cargo publish -p "$crate" $flags > "$log" 2>&1 || rc=$?
              cat "$log"
              [ "$rc" = 0 ] && break
              # published by an earlier run, but not visible to the check above: nothing to do
              if grep -q "already exists on crates.io" "$log"; then
                echo "::notice::$crate $version is already on crates.io; skipping"
                break
              fi
              [ "$attempt" = 3 ] && exit 1
              echo "::warning::$crate: attempt $attempt failed; retrying"
              sleep $((attempt * 30))
            done
            # the next crate needs this one in the index
            [ "$PUBLISH" = true ] && sleep 20
          done

  npm-native:
    name: npm native (${{ matrix.os }})
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        # ubuntu-22.04: the addon then needs glibc 2.35 or later
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    env:
      # the oldest macOS the kit supports (Rust, the cc crate and CMake read it)
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: X11 and Wayland headers (Linux; without the Wayland ones the addon is X11 only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libwayland-dev libxkbcommon-dev wayland-protocols pkg-config
      - name: Build the addon and the runtimes
        working-directory: bindings/node
        run: npm run build
      - name: The Linux addon has the Wayland host
        if: runner.os == 'Linux'
        run: grep -q xdg_wm_base bindings/node/blenderui.linux-x64.node
      - uses: actions/upload-artifact@v4
        with:
          name: npm-native-${{ matrix.os }}
          path: |
            bindings/node/blenderui.*.node
            bindings/node/bui-runtime*
          if-no-files-found: error

  npm:
    name: npm
    needs: [versions, ci, npm-native]
    # runs when the versions match, the native builds passed and CI passed (or was skipped on purpose)
    if: ${{ !cancelled() && needs.versions.result == 'success' && needs.npm-native.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    # builds the Windows x64 addon, then publishes one package per platform and the main package
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm to 11.5.1+ for trusted publishing (Node 22 ships an older one)
        run: npm install -g npm@^11.5.1
      - uses: oven-sh/setup-bun@v2 # the runtime tests build a Bun executable too (they skip it when Bun is missing)
        continue-on-error: true # setup-bun downloads from GitHub, which answers 504 now and then
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-native-*
          path: bindings/node
          merge-multiple: true
      - name: Install workspace dependencies
        working-directory: bindings
        run: npm ci
      - name: Build the Windows addon and stage the platform packages
        working-directory: bindings/node
        run: npm run build && node scripts/platforms.js --main
      - name: Publish the npm packages, platforms first, with no token (OIDC)
        run: |
          # the platform packages (@blender-ui/native-<tag>), then the workspaces of
          # bindings/package.json in order: native first, the frameworks depend on it
          dirs="$(ls -d bindings/node/npm/*) $(node -p "require('./bindings/package.json').workspaces.map(w => 'bindings/' + w).join(' ')")"
          missing=0
          for dir in $dirs; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if ! npm view "$name" name >/dev/null 2>&1; then
              # trusted publishing can only be configured on a package that exists
              echo "::warning::$name is not on npm yet: publish it once by hand (a platform package: node bindings/node/scripts/platforms.js --version 0.0.0-bootstrap, then npm publish --access public --tag bootstrap in its folder; otherwise cd $dir && npm publish --access public), then add its trusted publisher (docs/publishing.md). Skipping."
              missing=1
              continue
            fi
            if [ "$name" = @blender-ui/native ] && [ "$missing" = 1 ]; then
              echo "::error::a platform package is missing: @blender-ui/native would list an optional dependency that does not exist"
              exit 1
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm; skipping"
              continue
            fi
            flags="--access public --provenance"
            [ "$PUBLISH" = true ] || flags="$flags --dry-run"
            (cd "$dir" && npm publish $flags)
          done

  github-release:
    name: GitHub Release
    needs: [crates, npm]
    if: github.event_name == 'push' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release (notes from the commits since the last tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "release exists"; exit 0; }
          gh release create "$TAG" --title "BUI ${TAG#v}" --generate-notes --verify-tag
