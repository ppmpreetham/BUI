name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [tkinter syntax, Qt syntax, Components, Rust (blenderui), C kit, Rendering / GPU, Packaging, Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Screenshots help a lot for drawing issues.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: python
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "blenderui 0.1.0, Python 3.12, Windows 11 (or crate commit, Rust version)"
    validations: { required: true }
  - type: markdown
    attributes:
      value: "For tkinter apps: does the same code behave differently on the standard library tkinter? That's what we want to hear about."
