[workspace]
resolver = "2"
members = [
    "bindings/rust/bench/bui-bench",
    "bindings/rust/bench/gpui-bench",
    "bindings/rust/bench/gpui-fast-bench",
    "bindings/rust/blenderui",
    "bindings/rust/blenderui-imgui",
    "bindings/rust/blenderui-jsview",
    "bindings/rust/blenderui-macros",
    "bindings/rust/blenderui-node",
    "bindings/rust/blenderui-paint",
    "bindings/rust/blenderui-paint-gpui",
    "bindings/rust/blenderui-qjs",
    "bindings/rust/blenderui-sys",
    "bindings/rust/blenderui-table",
    "bindings/rust/blenderui-table-gpui",
    "bindings/rust/blenderui-tailwind",
    "bindings/rust/blenderui-vlist",
    "bindings/rust/blenderui-vlist-gpui",
    "showcase",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/ppmpreetham/BUI"
homepage = "https://bui.preetham.top"
authors = ["BUI contributors"]
rust-version = "1.88"

# Shipped binaries (bindings/node/scripts/build.js: the Node addon and the
# QuickJS runtime): whole-program LTO in one codegen unit. bui-runtime.exe
# measured 7.56 MB with `release`, 7.09 MB with this (Windows, MSVC).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
