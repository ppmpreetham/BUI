[package]
name = "blenderui-imgui"
description = "Dear ImGui on BUI for Rust: the real Dear ImGui in Blender's look, FFI generated from imgui.h plus a safe layer and a runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["gui", "imgui", "blender", "ui"]
categories = ["gui", "api-bindings"]

[dependencies]
# builds and links bui_cimgui (Dear ImGui + its C API + the BUI backend) with the C kit
blenderui-sys = { path = "../blenderui-sys", version = "0.1.0", features = ["imgui"] }
