[package]
name = "blenderui-macros"
description = "Compile-time macros for blenderui: rsx!/view!, #[component], css! and tw!"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["gui", "jsx", "rsx", "tailwind", "css"]
