[package]
name = "blenderui-vlist"
description = "Variable-height virtualized list core: one two-level height index for 100 to 10M+ items, anchor-based scrolling, measured wrapping, ItemSource and a chat list"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/blenderui-vlist"
keywords = ["list", "virtualization", "chat", "gui", "blender"]
categories = ["gui", "data-structures"]
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "Cargo.toml", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[dependencies]
blenderui-paint = { path = "../blenderui-paint", version = "0.4.0" }

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
inline_always = "allow"
unseparated_literal_suffix = "allow"
similar_names = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
absolute_paths = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
implicit_hasher = "allow"
significant_drop_tightening = "warn"
redundant_clone = "warn"
use_self = "warn"
redundant_else = "warn"
or_fun_call = "warn"
missing_const_for_fn = "warn"
derive_partial_eq_without_eq = "warn"
