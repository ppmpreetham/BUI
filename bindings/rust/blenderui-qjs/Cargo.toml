[package]
name = "blenderui-qjs"
description = "bui-runtime: blenderui with an embedded QuickJS engine, for small standalone JavaScript apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "bui-runtime"
path = "src/main.rs"

[dependencies]
# the kit features: blenderui's defaults, or a runtime's list from features.json
# (bindings/node/scripts/build.js: --no-default-features --features blenderui/...)
blenderui = { path = "../blenderui", default-features = false }
blenderui-jsview = { path = "../blenderui-jsview" }
rquickjs = { version = "0.14", features = ["classes", "properties", "array-buffer"] }

[features]
default = ["blenderui/default"]
