[package]
name = "blenderui"
description = "Blender's UI for Rust: gpui-style syntax, every HTML element and CSS, drawn by the BUI C kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/blenderui"
keywords = ["gui", "ui", "blender", "gpui", "html"]
categories = ["gui"]
readme = "README.md"
# the crate, its README, tests and examples (examples/site: the website's demos)
include = ["src/**", "tests/**", "examples/**", "README.md", "Cargo.toml", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[dependencies]
blenderui-table = { path = "../blenderui-table", version = "0.4.1" }
blenderui-vlist = { path = "../blenderui-vlist", version = "0.4.1" }
blenderui-sys = { path = "../blenderui-sys", version = "0.4.1", default-features = false }
blenderui-macros = { path = "../blenderui-macros", version = "0.4.1" }
blenderui-tailwind = { path = "../blenderui-tailwind", version = "0.4.1" }
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "flexbox_balance", "grid", "block_layout", "float_layout", "calc", "content_size"] }
paste = "1"
smallvec = { version = "1", features = ["union", "const_generics"] }

[features]
# Draw text with Windows' native GDI engine (system fonts) instead of the
# default portable engine (embedded Inter, like Blender; Slug on the GPU).
gdi-text = ["blenderui-sys/gdi-text"]
# GPU text with Slug by default (else the per-glyph atlas); see
# `Application::slug` / `blenderui::set_slug` to switch at runtime.
slug = ["blenderui-sys/slug"]
default = ["slug", "png", "gif", "bmp", "tga", "qoi", "jpeg", "webp", "hdr", "pnm", "svg", "video", "gpu", "freetype", "filebrowser"]
# The C kit's optional parts (features.json; see blenderui-sys): each costs
# binary size only when on. tests/features.rs checks this list has them all.
png = ["blenderui-sys/png"]
gif = ["blenderui-sys/gif"]
bmp = ["blenderui-sys/bmp"]
tga = ["blenderui-sys/tga"]
qoi = ["blenderui-sys/qoi"]
jpeg = ["blenderui-sys/jpeg"]
webp = ["blenderui-sys/webp"]
hdr = ["blenderui-sys/hdr"]
pnm = ["blenderui-sys/pnm"]
svg = ["blenderui-sys/svg"]
video = ["blenderui-sys/video"]
gpu = ["blenderui-sys/gpu"]
freetype = ["blenderui-sys/freetype"]
filebrowser = ["blenderui-sys/filebrowser"]
# the Lua host builds from the repository (bindings/lua), not through cargo
lua = ["blenderui-sys/lua"]
# Deprecated no-op: the portable engine is the default everywhere.
portable-text = ["blenderui-sys/portable-text"]

[dev-dependencies]
# Encoding only: the website-screenshot examples (examples/site) write PNGs.
# The library decodes every format with the kit (no Rust image decoder).
png = "0.17"
