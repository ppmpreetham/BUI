[package]
name = "blenderui-sys"
description = "Raw FFI bindings to the BUI C kit (Blender's UI as a C library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "bui_kit"
build = "build.rs"
keywords = ["gui", "ui", "blender", "ffi"]
categories = ["gui", "external-ffi-bindings"]
# csrc/ is git-ignored (vendored by scripts/vendor_c.py), so list it explicitly
include = ["src/**", "build.rs", "Cargo.toml", "csrc/**"]

[features]
# The portable stb_truetype text engine on Windows too (always on elsewhere).
portable-text = []

[build-dependencies]
cmake = "0.1"
