[package]
name = "blenderui-sys"
description = "Raw FFI bindings to the BUI C kit (Blender's UI as a C library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "bui_kit"
build = "build.rs"
keywords = ["gui", "ui", "blender", "ffi"]
categories = ["gui", "external-ffi-bindings"]
# csrc/ is git-ignored (vendored by scripts/vendor_c.py), so list it explicitly
include = ["src/**", "build.rs", "Cargo.toml", "csrc/**"]

[features]
# Windows' native GDI text engine (system fonts) instead of the portable
# engine (embedded Inter, GPU Slug glyphs).
gdi-text = []
# GPU text drawn with Slug (glyph outlines in the pixel shader) by default;
# without it, the per-glyph atlas. Switchable at runtime either way.
slug = []
default = ["slug"]
# Deprecated no-op: the portable engine is the default everywhere.
portable-text = []
# Also build and link Dear ImGui on BUI and its C API (bindings/imgui: bui_cimgui,
# bui_imgui; C++). Used by the blenderui-imgui crate.
imgui = []
# With `imgui`: ImGui's widgets drawn and handled as Blender's widgets (CMake
# BUI_IMGUI_BLENDER_WIDGETS; bindings/imgui/blender). Same API.
imgui-blender-widgets = ["imgui"]

[build-dependencies]
cmake = "0.1"
