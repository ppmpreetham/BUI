[package]
name = "blenderui-node"
description = "Node.js bindings for blenderui (napi-rs): Blender's UI from JavaScript and React"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
blenderui = { path = "../blenderui" }
napi = { version = "2.16", default-features = false, features = ["napi6"] }
napi-derive = "2.16"

[build-dependencies]
napi-build = "2"
